name: experimental-mirror

# Carries a build published in the private REALSYNCADE/SCDA-Experimental to the
# players: copies its bundle into a public pre-release here and puts latest.json
# on the `experimental` branch, the channel address compiled into every launcher.
# See .github/scripts/mirror_experimental.py for the checks.
#
# Needs the repository secret EXPERIMENTAL_READ_TOKEN: a fine-grained personal
# access token of the owner with Contents: read-only on SCDA-Experimental.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the mirror script (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          sparse-checkout: .github/scripts
      - name: Check out the experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental
          path: channel
      - name: Mirror
        working-directory: channel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPERIMENTAL_TOKEN: ${{ secrets.EXPERIMENTAL_READ_TOKEN }}
        run: python3 ../tools/.github/scripts/mirror_experimental.py
